<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            background-color: #14385c;
        }
    </style>
</head>

<body>
    <header></header>
    <main>
        <div class="container mt-5">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Settings</h5>
                    <p class="card-text">Payment</p>
                    <form action="">
                        <p class="fs-3 text-start">Saved cards:</p>

                        <label for="visaCard" class="text-start"> card number</label><br>
                        <div class="input-group mb-3">

                            <span class="visa"><i style="font-size: 50px;"
                                    class="fa-brands fa-cc-visa col-2  "></i></span>

                            <input type="text" class="form-control" placeholder="**** **** *** 3456"> <a href="#"
                                class="btn btn-success col-2 ts-1">remove card</a>
                        </div>
                        <label for="mastercard" class="text-start"> card number</label><br>
                        <div class="input-group mb-3">

                            <span class="visa"><i style="font-size: 50px;"
                                    class="fa-brands fa-cc-mastercard"></i></span>

                            <input type="text" class="form-control" placeholder="**** **** *** 7890"> <a href="#"
                                class="btn btn-success col-2 ts-1">remove card</a>
                        </div>
                        <p class="fs-3 text-start">Add new card:</p>
                        <div class="mb-3">
                            <p class="fs-6 text-start">cardholder name</p>
                            <input type="text" class="form-control" id="" placeholder="Omar">
                            <div class="container">
                                <div class="row">

                                    <p class="fs-6 text-start col-6">card Number</p>
                                    <p class="fs-6 text-start col-3">Expire</p>
                                    <p class="fs-6 text-start col-3">Cvv</p>
                                    <input type="text" style="display: flex ;width: 50%;"="form-control col-6" id=""
                                        placeholder="Omar">
                                    <input type="text" style="display: flex ;width: 25%;" class="form-control col-3"
                                        id="" placeholder="MM/YY">
                                    <input type="text" style="display: flex ;width: 25%;" class="form-control col-3"
                                        id="" placeholder="***">
                                </div>
                            </div>
                        </div>

                    </form>
                    <a href="#" class="btn btn-success">add card</a>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
